<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-SPIRE 生活羅盤 · Life Compass (Life Manager)</title>
<style>
:root{
  --navy:#0F1B2D; --slate:#1E3A5F; --amber:#F5A623; --cream:#F8F4ED; --sage:#7FB5A0;
  --fin:#F5A623; --spi:#7FB5A0; --phy:#E07A5F; --int:#6FA8DC; --rel:#A78BBA; --emo:#E8998D;
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:var(--navy); --bg-panel:var(--slate); --bg-card:rgba(255,255,255,.05);
  --text:var(--cream); --text-muted:#A9B7C6; --border:rgba(248,244,237,.14);
  --input-bg:rgba(255,255,255,.06); --shadow:0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:var(--cream); --bg-panel:#FFFFFF; --bg-card:rgba(15,27,45,.035);
  --text:var(--navy); --text-muted:#5b6b7a; --border:rgba(15,27,45,.12);
  --input-bg:rgba(15,27,45,.04); --shadow:0 8px 24px rgba(15,27,45,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh; transition:background .25s ease,color .25s ease;
}
.app{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand .mark{width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--fin) 0 60deg,var(--spi) 60deg 120deg,var(--phy) 120deg 180deg,var(--int) 180deg 240deg,var(--rel) 240deg 300deg,var(--emo) 300deg 360deg);flex:none;}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.3px;}
.brand p{margin:0;font-size:12px;color:var(--text-muted);}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
button{font-family:inherit;cursor:pointer;}
.btn{
  background:var(--bg-card); color:var(--text); border:1px solid var(--border);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--amber);color:var(--navy);border-color:var(--amber);}
.btn.primary:hover{filter:brightness(1.08);color:var(--navy);}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--border);font-size:16px;}
input[type=file]{display:none;}

nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;}
nav.tabs button{
  background:none;border:none;color:var(--text-muted);padding:10px 16px;font-size:14px;font-weight:600;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.tabs button.active{color:var(--amber);border-bottom-color:var(--amber);}

.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
@media (max-width:860px){.layout{grid-template-columns:1fr;}}

.panel{background:var(--bg-panel);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px;}
.compass-panel{position:sticky;top:20px;}
@media (max-width:860px){.compass-panel{position:static;}}

.compass-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
.compass-wrap svg{width:100%;max-width:300px;height:auto;}
.wedge{cursor:pointer;opacity:.85;transition:opacity .15s, transform .15s;transform-origin:150px 150px;}
.wedge:hover{opacity:1;}
.wedge.active{opacity:1;filter:drop-shadow(0 0 6px rgba(245,166,35,.6));}
.wedge-label{font-size:13px;font-weight:700;fill:var(--navy);pointer-events:none;}
.center-btn{cursor:pointer;}
.center-circle{fill:var(--bg-panel);stroke:var(--border);stroke-width:2;transition:.15s;}
.center-circle:hover, .center-circle.active{stroke:var(--amber);}
.center-text{font-size:12px;font-weight:700;fill:var(--text);pointer-events:none;}

.legend{display:none;}
.mobile-tabs{display:none;gap:8px;overflow-x:auto;padding-bottom:4px;}
@media (max-width:860px){
  .compass-wrap{display:none;}
  .mobile-tabs{display:flex;}
}
.mtab{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);font-size:11px;color:var(--text-muted);font-weight:600;}
.mtab.active{border-color:var(--amber);color:var(--amber);}
.mtab .dot{width:10px;height:10px;border-radius:50%;}

.score-summary{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.score-chip{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;font-size:12px;transition:.15s;}
.score-chip b{font-size:14px;}
.score-chip.clickable{cursor:pointer;}
.score-chip.clickable:hover{border-color:var(--amber);background:rgba(245,166,35,.08);}
.score-chip.clickable.active{border-color:var(--amber);box-shadow:0 0 6px rgba(245,166,35,.4);background:rgba(245,166,35,.04);}

.workspace h2{margin:0 0 4px;font-size:22px;}
.workspace .sub{color:var(--text-muted);font-size:13px;margin-bottom:20px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}
.card h3 .cnt{margin-left:auto;font-size:11px;color:var(--text-muted);font-weight:500;background:var(--bg-panel);padding:2px 8px;border-radius:20px;}

.slider-row{display:flex;align-items:center;gap:14px;}
input[type=range]{flex:1;accent-color:var(--amber);height:6px;}
.slider-val{font-size:20px;font-weight:800;width:34px;text-align:center;}

.row-form{display:flex;gap:8px;margin-bottom:12px;}
.row-form input[type=text], .row-form textarea{
  flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;
}
textarea{resize:vertical;min-height:60px;}
select{background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:12px;font-family:inherit;}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.list li{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;}
.list li .txt{flex:1;}
.list li .txt.done{text-decoration:line-through;color:var(--text-muted);}
.status-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
.status-badge.not_started{background:rgba(169,183,198,.2);color:var(--text-muted);}
.status-badge.in_progress{background:rgba(245,166,35,.2);color:var(--amber);}
.status-badge.done{background:rgba(127,181,160,.25);color:var(--sage);}
.del{background:none;border:none;color:var(--text-muted);font-size:16px;padding:2px 6px;border-radius:6px;}
.del:hover{color:#e05f5f;}
.empty{color:var(--text-muted);font-size:12px;font-style:italic;padding:6px 0;}

.journal-entry{border-bottom:1px dashed var(--border);padding:10px 0;}
.journal-entry:last-child{border-bottom:none;}
.journal-entry .date{font-size:11px;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:6px;}
.journal-entry .date .j-actions{margin-left:auto;display:flex;gap:4px;}
.journal-entry .text{font-size:13px;margin-top:6px;line-height:1.5;cursor:text;}

.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:640px){.overview-grid{grid-template-columns:1fr;}}
.radar-big svg{width:100%;height:auto;}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-card b{display:block;font-size:24px;color:var(--amber);}
.stat-card span{font-size:11px;color:var(--text-muted);}

.checkbox{width:18px;height:18px;accent-color:var(--sage);flex:none;}

.help-body h2{font-size:20px;margin-top:0;}
.help-body h3{font-size:15px;color:var(--amber);margin-top:24px;}
.help-body p, .help-body li{font-size:14px;line-height:1.7;color:var(--text);}
.help-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;}
.help-body td, .help-body th{border:1px solid var(--border);padding:8px 10px;text-align:left;}
.help-body th{background:var(--bg-card);}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;color:var(--navy);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--slate);color:var(--cream);
  padding:10px 20px;border-radius:30px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

footer.credit{text-align:center;color:var(--text-muted);font-size:11px;margin-top:30px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;max-width:360px;width:100%;text-align:center;}
.modal-box p{font-size:14px;margin:0 0 18px;line-height:1.6;}
.modal-actions{display:flex;gap:10px;justify-content:center;}
.modal-actions .btn{flex:1;justify-content:center;}

.framework-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--bg-panel);border:1px solid var(--border);margin-left:6px;vertical-align:middle;white-space:nowrap;}
.m4-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text-muted);margin-left:8px;vertical-align:middle;}
.center-emoji{font-size:26px;}
/* Edit button — always clearly visible */
.edit-icon{
  background:rgba(245,166,35,.12);
  border:1px solid var(--amber);
  color:var(--amber);
  font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:20px;cursor:pointer;
  transition:.15s;white-space:nowrap;flex:none;
}
.edit-icon:hover{background:var(--amber);color:var(--navy);}
.del{
  background:none;border:1px solid transparent;
  color:var(--text-muted);font-size:15px;
  padding:3px 7px;border-radius:20px;flex:none;
}
.del:hover{color:#e05f5f;border-color:#e05f5f;background:rgba(224,95,95,.1);}
/* list items wrap so buttons never clip off-screen */
.list li{flex-wrap:wrap;row-gap:6px;}
.list li .txt{min-width:60px;}
.inline-edit{flex:1;min-width:120px;background:var(--input-bg);border:1px solid var(--amber);border-radius:6px;padding:5px 8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;}
.item-txt-editable{cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .15s;}
.item-txt-editable:hover{text-decoration:underline dotted;background:rgba(245,166,35,.08);}
.edit-hint{
  font-size:11px;
  color:var(--text-muted);
  margin-left:6px;
  opacity:0.35;
  transition:opacity 0.15s;
  pointer-events:none;
  display:inline-block;
}
.item-txt-editable:hover .edit-hint{
  opacity:1;
  color:var(--amber);
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>F-SPIRE 生活羅盤 · Life Compass</h1>
        <p>Financial · Spiritual · Physical · Intellectual · Relational · Emotional</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle dark/light mode">🌙</button>
      <button class="btn" id="loadDemoBtn">✨ Demo Data</button>
      <button class="btn" id="resetBtn">🧹 Reset / Clean</button>
      <label class="btn" for="importFile">📥 Import JSON</label>
      <input type="file" id="importFile" accept="application/json">
      <button class="btn" id="exportJsonBtn">📤 Export JSON</button>
      <button class="btn primary" id="exportMdBtn">📝 Export Markdown</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard 儀表板</button>
    <button class="tab-btn" data-tab="help">Help / Readme 說明</button>
  </nav>

  <section id="tab-dashboard">
    <div class="layout">

      <div class="panel compass-panel">
        <div class="compass-wrap">
          <svg id="compassSvg" viewBox="0 0 300 300">
            <g id="wedgesGroup"></g>
            <circle class="center-circle" id="centerCircle" cx="150" cy="150" r="46"></circle>
            <text class="center-emoji" x="150" y="145" text-anchor="middle" style="pointer-events:none;">🧑</text>
            <text class="center-text" x="150" y="163" text-anchor="middle" style="font-size:10px;font-weight:600;pointer-events:none;">總覽 Overview</text>
          </svg>
        </div>
        <div class="mobile-tabs" id="mobileTabs"></div>
        <div class="score-summary" id="scoreSummary"></div>
      </div>

      <div class="panel workspace" id="workspace"></div>

    </div>
  </section>

  <section id="tab-help" style="display:none;">
    <div class="panel help-body" id="helpBody"></div>
  </section>

  <footer class="credit">F-SPIRE Life Manager · single-file offline tool · your data stays in this browser</footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ================= DATA MODEL ================= */
/* ================= SAFE STORAGE ================= */
/* Some preview/sandboxed contexts block localStorage entirely (throws on access).
   This wrapper falls back to an in-memory store so the app still runs there —
   data just won't persist across reloads in that specific case. In a normal
   browser (opening this file directly), localStorage works as usual. */
const _memStore = {};
const safeStorage = {
  getItem(key){ try{ return window.localStorage.getItem(key); }catch(e){ return (key in _memStore) ? _memStore[key] : null; } },
  setItem(key,val){ try{ window.localStorage.setItem(key,val); }catch(e){ _memStore[key] = val; } }
};

const DIMENSIONS = [
  {
    key:'financial',     zh:'財務', en:'Financial',     icon:'💰', varc:'--fin',
    m4:'Money',
    f4:'Fuel Future', f4_full:'Fuel your future.',
    p6:'Prove Right', p6_full:'PROVE yourself right.'
  },
  {
    key:'spiritual',     zh:'靈性', en:'Spiritual',     icon:'🕊️', varc:'--spi',
    m4:null,
    f4:'Find Purpose', f4_full:'Find your purpose.',
    p6:'Prayer Always', p6_full:'PRAYER always - Never underestimate its power.'
  },
  {
    key:'physical',      zh:'身體', en:'Physical',      icon:'💪', varc:'--phy',
    m4:'Muscle',
    f4:null, f4_full:null,
    p6:'Push Yourself', p6_full:'PUSH yourself when everyone doubts you.'
  },
  {
    key:'intellectual',  zh:'智識', en:'Intellectual',  icon:'📚', varc:'--int',
    m4:'Mindset',
    f4:'Focus Present', f4_full:'Focus on your present.',
    p6:'Promise Self', p6_full:"PROMISE yourself you'll never give up."
  },
  {
    key:'relational',    zh:'關係', en:'Relational',    icon:'🤝', varc:'--rel',
    m4:null,
    f4:null, f4_full:null,
    p6:'Proud of Self', p6_full:'PROUD of who you are.'
  },
  {
    key:'emotional',     zh:'情緒', en:'Emotional',     icon:'❤️', varc:'--emo',
    m4:'Mood',
    f4:'Forgive Past', f4_full:'Forgive your past.',
    p6:'Pick Up Self', p6_full:'PICK yourself up when you fall down.'
  },
];
const STORAGE_KEY = 'fspire_state_v1';
const THEME_KEY = 'fspire_theme';

function emptyDim(){ return { score:5, goals:[], journal:[], actions:[] }; }
function freshState(){
  const s = { dimensions:{}, updated: new Date().toISOString() };
  DIMENSIONS.forEach(d=> s.dimensions[d.key] = emptyDim());
  return s;
}
let state = loadState();
let activeDim = null; // null = overview

function loadState(){
  try{
    const raw = safeStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('load failed', e); }
  return freshState();
}
function saveState(){
  state.updated = new Date().toISOString();
  safeStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ================= THEME ================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t); // :root = <html>
  document.getElementById('themeToggle').textContent = t === 'dark' ? '🌙' : '☀️';
  safeStorage.setItem(THEME_KEY, t);
}
applyTheme(safeStorage.getItem(THEME_KEY) || 'dark');
document.getElementById('themeToggle').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};

/* ================= TOAST ================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ================= CUSTOM CONFIRM MODAL ================= */
function confirmDialog(message, onConfirm){
  // Try custom modal first, fall back to native confirm()
  try {
    const overlay = document.getElementById('modalOverlay');
    const msgEl = document.getElementById('modalMsg');
    const ok = document.getElementById('modalOk');
    const cancel = document.getElementById('modalCancel');
    if(!overlay || !msgEl || !ok || !cancel){
      // DOM elements missing — fall back to native confirm
      if(confirm(message)) onConfirm();
      return;
    }
    msgEl.textContent = message;
    overlay.classList.add('show');
    function cleanup(){
      overlay.classList.remove('show');
      ok.onclick=null; cancel.onclick=null; overlay.onclick=null;
    }
    ok.onclick = ()=>{ cleanup(); onConfirm(); };
    cancel.onclick = ()=>{ cleanup(); };
    overlay.onclick = (e)=>{ if(e.target === overlay) cleanup(); };
  } catch(e) {
    // If anything goes wrong, native confirm as last resort
    console.warn('confirmDialog fallback:', e);
    if(confirm(message)) onConfirm();
  }
}

/* ================= COMPASS SVG ================= */
const WEDGE_PATHS = [
  "M150,150 L150,30 A120,120 0 0,1 253.92,90 Z",
  "M150,150 L253.92,90 A120,120 0 0,1 253.92,210 Z",
  "M150,150 L253.92,210 A120,120 0 0,1 150,270 Z",
  "M150,150 L150,270 A120,120 0 0,1 46.08,210 Z",
  "M150,150 L46.08,210 A120,120 0 0,1 46.08,90 Z",
  "M150,150 L46.08,90 A120,120 0 0,1 150,30 Z",
];
const WEDGE_LABEL_POS = [
  [150,66],[214,110],[214,190],[150,234],[86,190],[86,110]
];
function buildCompass(){
  const g = document.getElementById('wedgesGroup');
  g.innerHTML = '';
  DIMENSIONS.forEach((d,i)=>{
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', WEDGE_PATHS[i]);
    path.setAttribute('class','wedge');
    path.style.fill = `var(${d.varc})`;
    path.dataset.key = d.key;
    path.addEventListener('click', ()=> selectDim(d.key));
    g.appendChild(path);

    const [lx,ly] = WEDGE_LABEL_POS[i];
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', lx); txt.setAttribute('y', ly);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('class','wedge-label');
    txt.textContent = d.icon + ' ' + d.zh;
    txt.style.pointerEvents = 'none';
    g.appendChild(txt);
  });
  document.getElementById('centerCircle').addEventListener('click', ()=> selectDim(null));
}
function buildMobileTabs(){
  const wrap = document.getElementById('mobileTabs');
  wrap.innerHTML = '';
  const ov = document.createElement('div');
  ov.className = 'mtab'; ov.dataset.key='';
  ov.innerHTML = `<span class="dot" style="background:var(--amber)"></span><span>總覽</span>`;
  ov.onclick = ()=> selectDim(null);
  wrap.appendChild(ov);
  DIMENSIONS.forEach(d=>{
    const el = document.createElement('div');
    el.className='mtab'; el.dataset.key=d.key;
    el.innerHTML = `<span class="dot" style="background:var(${d.varc})"></span><span>${d.icon}</span>`;
    el.onclick = ()=> selectDim(d.key);
    wrap.appendChild(el);
  });
}
function highlightCompass(){
  document.querySelectorAll('.wedge').forEach(w=> w.classList.toggle('active', w.dataset.key === activeDim));
  document.getElementById('centerCircle').classList.toggle('active', activeDim === null);
  document.querySelectorAll('.mtab').forEach(t=> t.classList.toggle('active', (t.dataset.key||null) === (activeDim||null) ));
  document.querySelectorAll('.score-chip').forEach(c=> c.classList.toggle('active', c.dataset.navDim === activeDim));
}

/* ================= RADAR ================= */
function radarPoints(scores, cx, cy, maxR){
  return scores.map((s,i)=>{
    const angle = (-90 + i*60) * Math.PI/180;
    const r = (s/10) * maxR;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
}
function buildRadarSVG(size, scores){
  const cx=size/2, cy=size/2, maxR=size*0.38;
  const rings = [0.25,0.5,0.75,1];
  let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  rings.forEach(r=>{
    const pts = radarPoints([10,10,10,10,10,10], cx, cy, maxR*r).map(p=>p.join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  for(let i=0;i<6;i++){
    const angle=(-90+i*60)*Math.PI/180;
    const x2=cx+maxR*Math.cos(angle), y2=cy+maxR*Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--border)" stroke-width="1"/>`;
  }
  const pts = radarPoints(scores, cx, cy, maxR).map(p=>p.join(',')).join(' ');
  svg += `<polygon points="${pts}" fill="var(--amber)" fill-opacity="0.28" stroke="var(--amber)" stroke-width="2"/>`;
  radarPoints(scores,cx,cy,maxR).forEach((p,i)=>{
    svg += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(${DIMENSIONS[i].varc})" stroke="var(--bg-panel)" stroke-width="1.5"/>`;
  });
  DIMENSIONS.forEach((d,i)=>{
    const angle=(-90+i*60)*Math.PI/180;
    const lx=cx+(maxR+18)*Math.cos(angle), ly=cy+(maxR+18)*Math.sin(angle);
    svg += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-muted)">${d.icon}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

    dim.journal = dim.journal.filter(j=>j.id!==b.dataset.delJ); saveState(); renderWorkspace();

  function startJournalEdit(j, div){
    const ta = document.createElement('textarea');
    ta.className='inline-edit'; ta.style.width='100%'; ta.style.minHeight='80px'; ta.value = j.text;
    div.replaceWith(ta); ta.focus();

    journalList.querySelectorAll('[data-del-j],[data-edit-j]').forEach(b=> b.onmousedown=(e)=>e.preventDefault());
  }
  journalList.querySelectorAll('[data-edit-j]').forEach(b=> b.onclick = ()=>{

    if(j) startJournalEdit(j, div);

  const actionsList = document.getElementById('actionsList');
  actionsList.innerHTML = dim.actions.length ? dim.actions.map(a=>`

function renderOverview(ws){
  const scores = DIMENSIONS.map(d=> state.dimensions[d.key].score);
  const totalGoals = DIMENSIONS.reduce((n,d)=> n + state.dimensions[d.key].goals.length, 0);
  const doneGoals = DIMENSIONS.reduce((n,d)=> n + state.dimensions[d.key].goals.filter(g=>g.status==='done').length, 0);
  const totalActions = DIMENSIONS.reduce((n,d)=> n + state.dimensions[d.key].actions.length, 0);
  const doneActions = DIMENSIONS.reduce((n,d)=> n + state.dimensions[d.key].actions.filter(a=>a.done).length, 0);
  const avg = (scores.reduce((a,b)=>a+b,0)/6).toFixed(1);

  ws.innerHTML = `
    <h2>🧭 Overview 總覽</h2>
    <p class="sub">Your balance across all six F-SPIRE dimensions. Click a wedge on the compass to dive into that area.</p>
    <div class="overview-grid">
      <div class="card radar-big">${buildRadarSVG(280, scores)}</div>
      <div>
        <div class="stat-cards">
          <div class="stat-card"><b>${avg}</b><span>Average Score</span></div>
          <div class="stat-card"><b>${doneGoals}/${totalGoals}</b><span>Goals Completed</span></div>
          <div class="stat-card"><b>${doneActions}/${totalActions}</b><span>Actions Done</span></div>
          <div class="stat-card"><b>${new Date(state.updated).toLocaleDateString()}</b><span>Last Updated</span></div>

        <div class="card" style="margin-top:14px;">
          <h3>Dimension Scores</h3>
          <ul class="list">
            ${DIMENSIONS.map(d=>`<li style="cursor:pointer;" data-nav-dim="${d.key}" title="Click to edit score"><span class="txt">${d.icon} ${d.zh} · ${d.en}</span><b style="color:var(${d.varc})">${state.dimensions[d.key].score}/10</b></li>`).join('')}
          </ul>
        </div>
      </div>

}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= EXPORT / IMPORT ================= */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('exportJsonBtn').onclick = ()=>{
  downloadFile(`fspire-data-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state, null, 2), 'application/json');
  toast('JSON exported');
};

document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed.dimensions) throw new Error('Invalid file format');
      DIMENSIONS.forEach(d=>{ if(!parsed.dimensions[d.key]) parsed.dimensions[d.key] = emptyDim(); });
      state = parsed;
      saveState(); selectDim(null); renderScoreSummary();
      toast('JSON imported successfully');
    }catch(err){
      toast('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

function toMarkdown(){
  let md = `# F-SPIRE Life Report\n\n_Generated ${new Date().toLocaleString()}_\n\n`;
  const scores = DIMENSIONS.map(d=>state.dimensions[d.key].score);
  const avg = (scores.reduce((a,b)=>a+b,0)/6).toFixed(1);
  md += `**Average Score:** ${avg}/10\n\n`;
  md += `| Dimension | Score |\n|---|---|\n`;
  DIMENSIONS.forEach(d=> md += `| ${d.icon} ${d.zh} / ${d.en} | ${state.dimensions[d.key].score}/10 |\n`);
  md += `\n---\n`;
  DIMENSIONS.forEach(d=>{
    const dim = state.dimensions[d.key];
    const tags = [];
    if(d.m4) tags.push(`4M: ${d.m4}`);
    if(d.f4) tags.push(`4F: ${d.f4_full}`);
    if(d.p6) tags.push(`6P: ${d.p6_full}`);
    const tagsStr = tags.length ? ` [${tags.join(' | ')}]` : '';
    md += `\n## ${d.icon} ${d.zh} · ${d.en}${tagsStr}  (Score: ${dim.score}/10)\n\n`;
    md += `### Goals\n`;
    md += dim.goals.length ? dim.goals.map(g=>`- [${g.status==='done'?'x':' '}] ${g.text} _(${statusLabel(g.status)})_`).join('\n') + '\n' : '_No goals recorded._\n';
    md += `\n### Reflection Journal\n`;
    md += dim.journal.length ? dim.journal.map(j=>`- **${j.date}:** ${j.text}`).join('\n') + '\n' : '_No journal entries._\n';
    md += `\n### Action Items\n`;
    md += dim.actions.length ? dim.actions.map(a=>`- [${a.done?'x':' '}] ${a.text}`).join('\n') + '\n' : '_No action items._\n';
  });
  return md;
}
